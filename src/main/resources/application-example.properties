# Application
spring.application.name=makeItHired

# Database (example only)
spring.datasource.url=jdbc:mysql://localhost:3306/your_database
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081

# Static files
spring.web.resources.static-location=file:uploads/

# File upload
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.makeItHired=INFO

# JWT (example only)
jwt.secret=your_secret_key_here
jwt.expiration-ms=86400000

# AI Model (example)
models.resume.parse.url=http://AI_IP:8000/parse
models.video.analyze.url=http://AI_IP:8000/analyze_video

# CORS
app.frontend.url=http://localhost:5173